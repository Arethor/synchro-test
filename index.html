<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego de Adivinar</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <div class="container">
        <h1>Adivina el número</h1>
        <p>Estoy pensando en un número entre 1 y 10...</p>

        <!-- Pedimos el número al usuario -->
        <input type="number" id="guess" min="1" max="10" placeholder="Tu número">

        <!-- Mensaje de comprobación -->
        <div class="container-message">
            <p id="message"></p>
        </div>
        
        <!-- Botón para comprobar el número -->
        <button id="checkBtn">Comprobar</button>
        <!-- botón para volver a jugar -->
        <button id="resetBtn" class="hidden">Jugar otra vez</button>
    </div>

  <script src="assets/js/script.js"></script>
    
</body>
</html>
